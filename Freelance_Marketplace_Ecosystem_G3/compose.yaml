services:
  db:
    image: mysql:8.0.42
    command: ["--transaction-isolation=READ-COMMITTED"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a local root password}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
