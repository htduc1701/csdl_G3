<form method="GET" action="{{ request.path }}" class="row g-2 align-items-end mb-3">
    <div class="col-auto">
        <label class="form-label" for="active-freelancer-id">Freelancer ID</label>
        <input type="number" id="active-freelancer-id" name="freelancer_id"
               class="form-control" value="{{ freelancer_id }}"
               min="4" max="7" required>
    </div>
    <div class="col-auto">
        <button type="submit" class="btn btn-outline-success">View</button>
    </div>
</form>
<p class="text-muted">Freelancer {{ freelancer_id }}</p>
