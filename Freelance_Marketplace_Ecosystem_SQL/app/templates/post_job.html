<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Post Job</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Mini Upwork G3</a>

        <a href="/client" class="btn btn-outline-light">
            Client Dashboard
        </a>
    </div>
</nav>

<div class="container mt-4">

    <div class="card shadow-sm">

        <div class="card-body">

            <h2>Post New Job</h2>

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label" for="client-id">Client ID</label>
                    <input type="number"
                           id="client-id"
                           name="client_id"
                           value="{{ form.get('client_id', '1') }}"
                           min="1"
                           aria-describedby="client-id-help"
                           {% if client_error %}aria-invalid="true"{% endif %}
                           class="form-control{% if client_error %} is-invalid{% endif %}"
                           required>
                    <div id="client-id-help" class="{{ 'invalid-feedback' if client_error else 'form-text' }}">
                        {{ client_error or 'Use Client ID 1 for the demo workflow.' }}
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Category</label>

                    <select name="category_id"
                            class="form-select"
                            required>

                        {% for category in categories %}

                        <option value="{{ category.category_id }}"
                                {% if form.get('category_id') == category.category_id|string %}selected{% endif %}>
                            {{ category.category_name }}
                        </option>

                        {% endfor %}

                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Job Title</label>

                    <input type="text"
                           name="title"
                           value="{{ form.get('title', '') }}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>

                    <textarea name="description"
                              class="form-control"
                              rows="4"
                              required>{{ form.get('description', '') }}</textarea>
                </div>

                {% if budget_error %}
                <div class="alert alert-danger" role="alert">{{ budget_error }}</div>
                {% endif %}
                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Minimum Budget
                        </label>

                        <input type="number"
                               step="0.01"
                               min="0"
                               name="budget_min"
                               value="{{ form.get('budget_min', '') }}"
                               class="form-control"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Maximum Budget
                        </label>

                        <input type="number"
                               step="0.01"
                               min="0"
                               name="budget_max"
                               value="{{ form.get('budget_max', '') }}"
                               class="form-control"
                               required>

                    </div>

                </div>

                <div class="mb-3">
                    <label class="form-label" for="deadline">Deadline</label>

                    <input type="date"
                           id="deadline"
                           name="deadline"
                           value="{{ form.get('deadline', '') }}"
                           min="{{ minimum_deadline }}"
                           aria-describedby="deadline-help"
                           {% if deadline_error %}aria-invalid="true"{% endif %}
                           class="form-control{% if deadline_error %} is-invalid{% endif %}">
                    <div id="deadline-help" class="{{ 'invalid-feedback' if deadline_error else 'form-text' }}">
                        {{ deadline_error or 'Optional. Choose a date after today.' }}
                    </div>
                </div>

                <button type="submit"
                        class="btn btn-primary">
                    Post Job
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
