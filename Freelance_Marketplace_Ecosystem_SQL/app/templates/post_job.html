<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Post Job</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Mini Upwork G3</a>

        <a href="/client" class="btn btn-outline-light">
            Client Dashboard
        </a>
    </div>
</nav>

<div class="container mt-4">

    <div class="card shadow-sm">

        <div class="card-body">

            <h2>Post New Job</h2>

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Client ID</label>
                    <input type="number"
                           name="client_id"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Category</label>

                    <select name="category_id"
                            class="form-select"
                            required>

                        {% for category in categories %}

                        <option value="{{ category.category_id }}">
                            {{ category.category_name }}
                        </option>

                        {% endfor %}

                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Job Title</label>

                    <input type="text"
                           name="title"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>

                    <textarea name="description"
                              class="form-control"
                              rows="4"
                              required></textarea>
                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Minimum Budget
                        </label>

                        <input type="number"
                               step="0.01"
                               name="budget_min"
                               class="form-control"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Maximum Budget
                        </label>

                        <input type="number"
                               step="0.01"
                               name="budget_max"
                               class="form-control"
                               required>

                    </div>

                </div>

                <div class="mb-3">
                    <label class="form-label">Deadline</label>

                    <input type="date"
                           name="deadline"
                           class="form-control">
                </div>

                <button type="submit"
                        class="btn btn-primary">
                    Post Job
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
