<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Proposal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Mini Upwork G3</a>

        <a href="/freelancer" class="btn btn-outline-light">
            Freelancer Dashboard
        </a>
    </div>
</nav>

<div class="container mt-4">

    <div class="card shadow-sm">
        <div class="card-body">

            <h2>Submit Proposal</h2>

            <p>
                <strong>Job:</strong> {{ job.title }}
            </p>

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Freelancer ID</label>

                    <input type="number"
                           name="freelancer_id"
                           class="form-control"
                           value="4"
                           readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label">Proposed Amount</label>

                    <input type="number"
                           step="0.01"
                           name="proposed_amount"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Estimated Days</label>

                    <input type="number"
                           name="estimated_days"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Cover Letter</label>

                    <textarea name="cover_letter"
                              class="form-control"
                              rows="5"
                              required></textarea>
                </div>

                <button class="btn btn-success" type="submit">
                    Submit Proposal
                </button>

            </form>

        </div>
    </div>

</div>

</body>
</html>
